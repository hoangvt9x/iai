[package]
name = "iai-layout"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/tongnghia2026/iai"
publish = false

[lib]
name = "iai_layout"
path = "src/lib.rs"

[dependencies]
calamine = { version = "0.26", features = ["dates"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
csv = "1"

[lints]
workspace = true
